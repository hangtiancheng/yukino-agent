global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus.rules.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "yukino-agent"
    metrics_path: /api/metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]
