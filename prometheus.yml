# This copy is mounted into the Prometheus container by docker-compose.yml, so
# host-run dev servers are reached through host.docker.internal. The Homebrew
# setup at /opt/homebrew/etc/prometheus.yml is identical except that it targets
# 127.0.0.1 and points rule_files at /opt/homebrew/etc/prometheus.rules.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus.rules.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "yukino-agent"
    metrics_path: /api/metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]
